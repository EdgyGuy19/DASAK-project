<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: #e6edf3;
            background: #11151b;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 28px;
            background: #1b222c;
            border: 1px solid #343f4d;
            border-radius: 6px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #5f6d80;
            border-radius: 4px;
            background: #1b222c;
            color: inherit;
            font: inherit;
        }

        button {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #315b85;
            border-radius: 4px;
            background: #315b85;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #3b6a99;
        }

        a {
            color: #9cc9ff;
            text-underline-offset: 3px;
        }

        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #9cc9ff;
            outline-offset: 3px;
        }

        .error-message {
            display: none;
            margin-top: 12px;
            color: #ff9e9e;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Register</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required minlength="3" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required minlength="8">
                </div>
                <button type="submit">Register</button>
                <div class="error-message" id="errorMessage"></div>
            </form>
            <p style="text-align:center; margin-top:15px;">
                Already have an account? <a href="/">Log in</a>
            </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (res.status === 409) {
                    errorEl.textContent = 'Username or email already taken';
                } else if (res.status === 422) {
                    errorEl.textContent = 'Check your input (username 3–50 chars, valid email, password 8+ chars)';
                } else if (!res.ok) {
                    errorEl.textContent = 'Registration failed';
                } else {
                    window.location.href = '/';
                    return;
                }
                errorEl.style.display = 'block';
            } catch (err) {
                errorEl.textContent = 'Could not reach the server';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
