<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .navbar h1 {
            color: #333;
            font-size: 24px;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .welcome h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            color: #333;
            text-align: left;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            color: #555;
        }

        .btn {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
        }

        .edit-btn {
            background: #667eea;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .view-btn {
            background: #667eea;
            color: white;
        }

        .add-btn {
            background: #27ae60;
            color: white;
            margin-bottom: 15px;
        }

        .admin-role {
            color: #764ba2;
            font-weight: bold;
        }

        .user-role {
            color: #555;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>Admin Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <p id="accessStatus" role="status">Checking admin access…</p>
    <div class="container" id="adminContent" hidden>
        <div class="welcome">
            <h2>Welcome, Admin</h2>
            <p>View registered users.</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="userCount">—</h3>
                <p>Users shown</p>
            </div>
        </div>

        <div class="section">
            <h2>Users</h2>
            <p id="userStatus" role="status">Loading users…</p>
            <table>
                <thead>
                    <tr><th>Username</th><th>Email</th><th>Role</th></tr>
                </thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function getData(path) {
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                throw new Error('Please log in.');
            }
            const response = await fetch(path, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.status === 401) {
                logout();
                throw new Error('Please log in again.');
            }
            if (response.status === 403) {
                window.location.href = '/user';
                throw new Error('Admin access required.');
            }
            if (!response.ok) {
                throw new Error('Could not load data. Please reload to try again.');
            }
            return response.json();
        }

        function addRow(tableId, values) {
            const row = document.createElement('tr');
            for (const value of values) {
                const cell = document.createElement('td');
                // Display database values as text, never as HTML.
                cell.textContent = value ?? '—';
                row.appendChild(cell);
            }
            document.getElementById(tableId).appendChild(row);
        }

        async function loadUsers() {
            const status = document.getElementById('userStatus');
            try {
                const users = await getData('/api/admin/users');
                for (const user of users) {
                    addRow('userRows', [user.username, user.email, user.is_admin ? 'Admin' : 'User']);
                }
                document.getElementById('userCount').textContent = users.length;
                status.textContent = users.length ? 'Showing up to 100 users.' : 'No users found.';
            } catch (error) {
                status.textContent = error.message;
            }
        }

        window.addEventListener('load', async function() {
            try {
                await getData('/api/admin/check');
                document.getElementById('accessStatus').hidden = true;
                document.getElementById('adminContent').hidden = false;
                await loadUsers();
            } catch (error) {
                document.getElementById('accessStatus').textContent = error.message;
            }
        });

        function logout() {
            sessionStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
