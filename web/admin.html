<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: #e6edf3;
            background: #11151b;
        }

        h1, h2, h3, p {
            margin: 0;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 20px;
            font-weight: 600;
        }

        h3 {
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        a {
            color: #9cc9ff;
            text-underline-offset: 3px;
        }

        button {
            padding: 8px 14px;
            border: 1px solid #5f6d80;
            border-radius: 4px;
            background: #1b222c;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #283341;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #9cc9ff;
            outline-offset: 3px;
        }

        .navbar {
            max-width: 960px;
            margin: 0 auto 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #343f4d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .footer {
            margin-top: 24px;
            color: #adb9c7;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 20px;
            }
        }

        #accessStatus {
            max-width: 960px;
            margin: 0 auto;
            color: #adb9c7;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome p,
        .stat-card p,
        #userStatus {
            color: #adb9c7;
        }

        .stats {
            margin-bottom: 20px;
        }

        .stat-card {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 24px;
        }

        .section {
            padding: 24px;
            overflow-x: auto;
            background: #1b222c;
            border: 1px solid #343f4d;
            border-radius: 6px;
        }

        #userStatus {
            margin-bottom: 16px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #343f4d;
            overflow-wrap: anywhere;
        }

        th {
            background: #11151b;
            font-size: 14px;
            font-weight: 600;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        @media (max-width: 600px) {
            .section {
                padding: 16px;
            }

            th, td {
                padding: 10px 6px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>Admin Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <p id="accessStatus" role="status">Checking admin access…</p>
    <div class="container" id="adminContent" hidden>
        <div class="welcome">
            <h2>Welcome, Admin</h2>
            <p>View registered users.</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="userCount">—</h3>
                <p>Users shown</p>
            </div>
        </div>

        <div class="section">
            <h2>Users</h2>
            <p id="userStatus" role="status">Loading users…</p>
            <table>
                <thead>
                    <tr><th>Username</th><th>Email</th><th>Role</th></tr>
                </thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function getData(path) {
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                throw new Error('Please log in.');
            }
            const response = await fetch(path, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.status === 401) {
                logout();
                throw new Error('Please log in again.');
            }
            if (response.status === 403) {
                window.location.href = '/user';
                throw new Error('Admin access required.');
            }
            if (!response.ok) {
                throw new Error('Could not load data. Please reload to try again.');
            }
            return response.json();
        }

        function addRow(tableId, values) {
            const row = document.createElement('tr');
            for (const value of values) {
                const cell = document.createElement('td');
                // Display database values as text, never as HTML.
                cell.textContent = value ?? '—';
                row.appendChild(cell);
            }
            document.getElementById(tableId).appendChild(row);
        }

        async function loadUsers() {
            const status = document.getElementById('userStatus');
            try {
                const users = await getData('/api/admin/users');
                for (const user of users) {
                    addRow('userRows', [user.username, user.email, user.is_admin ? 'Admin' : 'User']);
                }
                document.getElementById('userCount').textContent = users.length;
                status.textContent = users.length ? 'Showing up to 100 users.' : 'No users found.';
            } catch (error) {
                status.textContent = error.message;
            }
        }

        window.addEventListener('load', async function() {
            try {
                await getData('/api/admin/check');
                document.getElementById('accessStatus').hidden = true;
                document.getElementById('adminContent').hidden = false;
                await loadUsers();
            } catch (error) {
                document.getElementById('accessStatus').textContent = error.message;
            }
        });

        function logout() {
            sessionStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
